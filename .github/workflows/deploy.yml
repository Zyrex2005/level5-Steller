name: Deploy Contracts to Testnet
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
jobs:
  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 'stable'
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry and binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            contracts/escrow_contract/target
            contracts/reputation_contract/target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Stellar CLI
        run: cargo binstall --no-confirm stellar-cli

      - name: Build and Deploy Escrow Contract
        run: |
          cd contracts/escrow_contract
          cargo build --target wasm32-unknown-unknown --release
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/skillescrow_escrow_contract.wasm
          
          echo "Generating identities..."
          stellar keys generate deployer --network testnet || true
          stellar keys fund deployer --network testnet || true
          echo "Deploying Escrow Contract..."
          ESCROW_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/skillescrow_escrow_contract.optimized.wasm \
            --source deployer \
            --network testnet 2>deploy_err.log) || { cat deploy_err.log; exit 1; }
          echo "Escrow Contract deployed at: $ESCROW_ID"

      - name: Build and Deploy Reputation Contract
        run: |
          cd contracts/reputation_contract
          cargo build --target wasm32-unknown-unknown --release
          stellar contract optimize --wasm target/wasm32-unknown-unknown/release/skillescrow_reputation_contract.wasm
          
          echo "Deploying Reputation Contract..."
          REPUTE_ID=$(stellar contract deploy \
            --wasm target/wasm32-unknown-unknown/release/skillescrow_reputation_contract.optimized.wasm \
            --source deployer \
            --network testnet 2>deploy_err.log) || { cat deploy_err.log; exit 1; }
          echo "Reputation Contract deployed at: $REPUTE_ID"

          echo "Fetching Test Token (Native XLM asset) ID..."
          TOKEN_ID=$(stellar contract id asset --asset native --network testnet)
          echo "Native Token ID is: $TOKEN_ID"
