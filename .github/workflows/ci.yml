name: SkillEscrow CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  test-backend:
    name: Backend API & Relay Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Run Backend Unit Tests
        run: |
          cd backend
          npm test

  build-frontend:
    name: Frontend React Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Frontend Application
        run: |
          cd frontend
          npm run build

  test-contracts:
    name: Soroban Smart Contract Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.77.0
        with:
          targets: wasm32-unknown-unknown

      - name: Update Cargo Dependencies
        run: |
          cd contracts/escrow_contract
          cargo update -p ethnum || true
          cargo update -p arbitrary --precise 1.3.2 || true
          cargo update -p derive_arbitrary --precise 1.3.2 || true
          cd ../reputation_contract
          cargo update -p ethnum || true
          cargo update -p arbitrary --precise 1.3.2 || true
          cargo update -p derive_arbitrary --precise 1.3.2 || true

      - name: Test Escrow Contract
        run: |
          cd contracts/escrow_contract
          cargo test

      - name: Test Reputation Contract
        run: |
          cd contracts/reputation_contract
          cargo test
