name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: {}

jobs:
  contracts:
    name: Contract Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned instead of floating "stable" — a recent stable release shipped
          # a std-lib layout change (TryFromIntError) that breaks ethnum <=1.5.2,
          # a transitive dependency of soroban-sdk. 1.90.0 predates that regression.
          toolchain: '1.90.0'
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/escrow_contract/target/
            contracts/reputation_contract/target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Build Escrow Contract
        run: |
          cd contracts/escrow_contract
          # Belt-and-braces fix: force ethnum to the patched release even if
          # Cargo.lock still resolves an older, broken version.
          cargo update -p ethnum --precise 1.5.3 || true
          cargo build --locked --target wasm32-unknown-unknown --release

      - name: Run Escrow Contract Tests
        run: |
          cd contracts/escrow_contract
          cargo test --locked --verbose

      - name: Build Reputation Contract
        run: |
          cd contracts/reputation_contract
          cargo update -p ethnum --precise 1.5.3 || true
          cargo build --locked --target wasm32-unknown-unknown --release

      - name: Run Reputation Contract Tests
        run: |
          cd contracts/reputation_contract
          cargo test --locked --verbose

  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: npm run build