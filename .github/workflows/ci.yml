name: CI Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: {}

jobs:
  backend:
    name: Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Backend Tests
        run: npm test

  frontend:
    name: Frontend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Frontend
        run: npm run build

  contracts:
    name: Soroban Smart Contract Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'stable'
          targets: wasm32-unknown-unknown

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/escrow_contract/target/
            contracts/reputation_contract/target/
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-ci-

      - name: Build Escrow Contract
        run: |
          cd contracts/escrow_contract
          cargo build --target wasm32-unknown-unknown --release

      - name: Run Escrow Contract Tests
        run: |
          cd contracts/escrow_contract
          cargo test --verbose

      - name: Build Reputation Contract
        run: |
          cd contracts/reputation_contract
          cargo build --target wasm32-unknown-unknown --release

      - name: Run Reputation Contract Tests
        run: |
          cd contracts/reputation_contract
          cargo test --verbose
